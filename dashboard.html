<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summit Air — Dispatch Board</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2233; --panel2: #131b29; --line: #2a3547;
    --text: #e8edf5; --muted: #8695ac; --accent: #4da3ff;
    --open: #1f7a4d; --booked: #3a4557;
    --emergency: #e5484d; --urgent: #f2a71b; --new: #4da3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  .live { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 0 0 rgba(46,204,113,.6); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)} 70%{box-shadow:0 0 0 8px rgba(46,204,113,0)} 100%{box-shadow:0 0 0 0 rgba(46,204,113,0)} }
  .spacer { flex: 1; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: var(--emergency); color: #ff9a9d; }
  label.toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; }
  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .n { font-size: 26px; font-weight: 650; }
  .tile .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
  .tile.alert .n { color: var(--emergency); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 26px 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 12px 14px; }
  .card.emergency { border-left-color: var(--emergency); }
  .card.urgent { border-left-color: var(--urgent); }
  .card.new { border-left-color: var(--new); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card .name { font-weight: 600; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: .4px; }
  .badge.emergency { background: rgba(229,72,77,.16); color: #ff9a9d; }
  .badge.urgent { background: rgba(242,167,27,.16); color: #ffce7a; }
  .badge.new { background: rgba(77,163,255,.16); color: #a9d3ff; }
  .card .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .empty { color: var(--muted); font-style: italic; padding: 4px 2px; }
  .county-block { margin-bottom: 24px; }
  .county-block h3 { font-size: 14px; margin: 0 0 8px; }
  .grid-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 720px; }
  th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
  th { background: var(--panel2); color: var(--muted); font-weight: 600; font-size: 11.5px; white-space: nowrap; }
  td.win { background: var(--panel2); color: var(--muted); font-size: 11.5px; white-space: nowrap; font-weight: 600; }
  .cell { border-radius: 6px; padding: 4px 6px; font-size: 12px; min-height: 34px; }
  .cell.open { background: rgba(46,204,113,.12); color: #7ee2a8; }
  .cell.booked { background: rgba(120,135,160,.10); color: var(--muted); }
  .cell.newbook { background: rgba(77,163,255,.14); color: #bcdcff; outline: 1px solid rgba(77,163,255,.5); }
  .cell .who { color: var(--text); font-size: 12px; }
  .cell .tech { font-size: 10.5px; opacity: .7; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin: 4px 0 18px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .err { color: #ff9a9d; padding: 12px; }
</style>
</head>
<body>
<header>
  <h1>🔧 Summit Air — Dispatch Board</h1>
  <div class="live"><span class="dot"></span><span id="status">connecting…</span></div>
  <div class="spacer"></div>
  <label class="toggle"><input type="checkbox" id="auto" checked> auto-refresh</label>
  <button id="refresh">Refresh</button>
  <button id="reset" class="danger">Reset CRM</button>
</header>
<main>
  <div class="tiles" id="tiles"></div>

  <h2>Priority Queue</h2>
  <div class="cards" id="priority"></div>

  <h2>New Bookings — this session</h2>
  <div class="cards" id="newbookings"></div>

  <h2>Schedule</h2>
  <div class="legend">
    <span><i class="sw" style="background:rgba(46,204,113,.4)"></i> Open</span>
    <span><i class="sw" style="background:rgba(120,135,160,.35)"></i> Booked (existing)</span>
    <span><i class="sw" style="background:rgba(77,163,255,.5)"></i> Booked this session</span>
  </div>
  <div id="schedule"></div>
</main>

<script>
const BASE = location.origin;
let timer = null;

function isNew(b){ return b && b.booking_id && !String(b.booking_id).startsWith("BK-SEED"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function load(){
  let s;
  try {
    const r = await fetch(BASE + "/admin/state", {headers:{"ngrok-skip-browser-warning":"1"}});
    s = await r.json();
  } catch(e){
    document.getElementById("status").textContent = "backend unreachable";
    document.getElementById("schedule").innerHTML = '<div class="err">Could not reach '+BASE+'/admin/state — is the backend running?</div>';
    return;
  }
  const now = new Date().toLocaleTimeString();
  document.getElementById("status").textContent = "updated " + now + "  ·  backend: mock";

  const bookings = s.bookings || [], priority = s.priority_queue || [], slots = s.slots || [];
  const live = bookings.filter(isNew);

  // Tiles
  document.getElementById("tiles").innerHTML = [
    ["Open slots", s.open_slots, ""],
    ["Booked", s.booked_slots, ""],
    ["Priority queue", priority.length, priority.length ? "alert" : ""],
    ["New this session", live.length, ""],
  ].map(([l,n,cls]) => `<div class="tile ${cls}"><div class="n">${n??"–"}</div><div class="l">${l}</div></div>`).join("");

  // Priority
  const pq = document.getElementById("priority");
  pq.innerHTML = priority.length ? priority.map(p => {
    const lvl = (p.level||"URGENT").toLowerCase();
    return `<div class="card ${lvl}">
      <div class="top"><span class="name">${esc(p.name)||"(no name)"}</span><span class="badge ${lvl}">${esc(p.level)}</span></div>
      <div class="meta">${esc(p.reason)}</div>
      ${p.details?`<div class="meta">“${esc(p.details)}”</div>`:""}
      <div class="meta">${esc(p.address)||"address n/a"} · ${esc(p.phone)||"no phone"}</div>
    </div>`;
  }).join("") : '<div class="empty">No priority escalations.</div>';

  // New bookings
  const nb = document.getElementById("newbookings");
  nb.innerHTML = live.length ? live.map(b => {
    const when = b.scheduled_date ? `${esc(b.scheduled_day)} ${esc(b.scheduled_date)} · ${esc(b.scheduled_window)}` : `unscheduled (req: ${esc(b.preferred_window)||"—"})`;
    return `<div class="card new">
      <div class="top"><span class="name">${esc(b.name)}</span><span class="badge new">${esc((b.urgency||"").toUpperCase())||"NEW"}</span></div>
      <div class="meta">${esc(b.service_type)} — ${esc(b.issue_description)||"no detail"}</div>
      <div class="meta">${esc(b.address)} · ${esc(b.property_type)}</div>
      <div class="meta">🗓 ${when}${b.technician_name?` · ${esc(b.technician_name)}`:""}</div>
    </div>`;
  }).join("") : '<div class="empty">No bookings yet this session.</div>';

  // Schedule grid — one table per technician
  const bySlot = {}; bookings.forEach(b => { if (b.slot_id) bySlot[b.slot_id] = b; });
  const techs = [...new Set(slots.map(x => x.technician_name))].sort();
  const dates = [...new Set(slots.map(x => x.date))].sort();
  const windows = [...new Set(slots.map(x => x.window))]; // already ordered by window_order in query
  const dayLabel = {}; slots.forEach(x => dayLabel[x.date] = x.day_of_week);

  document.getElementById("schedule").innerHTML = techs.map(tech => {
    let head = "<tr><th>Window</th>" + dates.map(d => `<th>${dayLabel[d]||""}<br>${d.slice(5)}</th>`).join("") + "</tr>";
    let rows = windows.map(w => {
      let cells = dates.map(d => {
        const slot = slots.find(x => x.technician_name===tech && x.date===d && x.window===w);
        if (!slot) return "<td></td>";
        if (!slot.booked) return `<td><div class="cell open">Open</div></td>`;
        const bk = bySlot[slot.id];
        const cls = isNew(bk) ? "newbook" : "booked";
        const who = bk ? esc(bk.name) : "Booked";
        return `<td><div class="cell ${cls}"><div class="who">${who}</div></div></td>`;
      }).join("");
      return `<tr><td class="win">${esc(w)}</td>${cells}</tr>`;
    }).join("");
    return `<div class="county-block"><h3>🔧 ${esc(tech)}</h3><div class="grid-wrap"><table>${head}${rows}</table></div></div>`;
  }).join("");
}

document.getElementById("refresh").onclick = load;
document.getElementById("reset").onclick = async () => {
  if (!confirm("Reset the CRM to a clean seeded backlog? This clears all test bookings and priority flags.")) return;
  await fetch(BASE + "/admin/reset", {method:"POST", headers:{"ngrok-skip-browser-warning":"1"}});
  load();
};
document.getElementById("auto").onchange = (e) => {
  if (e.target.checked) timer = setInterval(load, 4000);
  else { clearInterval(timer); timer = null; }
};

load();
timer = setInterval(load, 4000);
</script>
</body>
</html>
